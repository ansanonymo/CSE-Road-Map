<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSE Roadmap</title>
<meta name="description" content="Self-study roadmaps built from the BUET CSE and Oxford CS degrees, with progress tracking.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fdf'/%3E%3Cpath d='M9 22l5-6 4 4 5-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var s = JSON.parse(localStorage.getItem("cser:settings") || "{}");
    var t = s.theme || "light"; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/dashboard" data-tip="Go to the dashboard">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text" id="brandText">Unified CSE Roadmap</span>
    </a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme" data-tip="Switch light / dark theme"></button>
  </div>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/dashboard" data-view="dashboard">Dashboard</a>
    <a href="#/roadmap" data-view="roadmap">Roadmap</a>
    <a href="#/courses" data-view="courses">Courses</a>
    <a href="#/tags" data-view="tags">Tags</a>
    <a href="#/settings" data-view="settings">Settings</a>
  </nav>
</header>

<main id="main" class="main" tabindex="-1">
  <p class="loading">Loading roadmap…</p>
</main>

<footer class="footer">
  <span id="footerText"></span>
</footer>

<button type="button" class="fab" id="timerFab" aria-label="Focus timer" aria-controls="timerPanel" aria-expanded="false"></button>
<div class="timer-panel" id="timerPanel" role="dialog" aria-label="Focus timer" hidden></div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <h2 id="modalTitle"></h2>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="modalCancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

</body></html>
